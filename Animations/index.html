<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LudoPoly Token</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    <style>
      /* --- PHYSICS ANIMATIONS --- */

      /* BREATHING (IDLE) - Continuous */
      @keyframes breathe {
        0%, 100% { transform: scale(1, 1) translateY(0); }
        50% { transform: scale(1.03, 0.97) translateY(1px); }
      }

      /* TERROR: Rapid shivering, one-shot duration */
      @keyframes terror-shiver {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        10%, 30%, 50%, 70%, 90% { transform: translate(-2px, -1px) rotate(-1deg); }
        20%, 40%, 60%, 80% { transform: translate(2px, 1px) rotate(1deg); }
      }

      /* LAUGH: Energetic belly bounce */
      @keyframes laugh-belly {
        0%, 100% { transform: translateY(0) scale(1, 1) rotate(0deg); }
        25% { transform: translateY(10px) scale(1.2, 0.8) rotate(-5deg); }
        75% { transform: translateY(-5px) scale(0.9, 1.1) rotate(5deg); }
      }

      /* SADNESS: Deep slump */
      @keyframes sadness-slump {
        0%, 100% { transform: translateY(0) scale(1, 1); }
        50% { transform: translateY(15px) scale(1.1, 0.9); }
      }

      /* CRY: Sobbing heave */
      @keyframes cry-sobbing {
        0%, 100% { transform: translateY(0) scale(1, 1); }
        20%, 60% { transform: translateY(12px) scale(1.15, 0.85); }
        40%, 80% { transform: translateY(4px) scale(0.95, 1.05); }
      }

      /* PAIN: Violent impact and recoil */
      @keyframes pain-impact {
        0% { transform: translateY(0) scale(1, 1); }
        10% { transform: translateY(40px) scale(1.7, 0.3); } /* Squash */
        25% { transform: translateY(-30px) scale(0.6, 1.4); } /* Recoil Stretch */
        45% { transform: translateY(15px) scale(1.2, 0.8); }
        70% { transform: translateY(-5px) scale(0.9, 1.1); }
        100% { transform: translateY(0) scale(1, 1); }
      }

      /* JOY: High celebration bounce */
      @keyframes joy-celebrate {
        0% { transform: translateY(0) scale(1, 1); }
        20% { transform: translateY(15px) scale(1.3, 0.7); }
        50% { transform: translateY(-70px) scale(0.8, 1.2) rotate(15deg); }
        80% { transform: translateY(10px) scale(1.2, 0.8) rotate(-5deg); }
        100% { transform: translateY(0) scale(1, 1); }
      }

      /* JOY VARIANT 2 — Series of small hops */
      @keyframes joy-2-hops {
        0%, 100% { transform: translate(0, 0); }
        20%      { transform: translate(0, -18px); }
        30%      { transform: translate(0, 3px); }
        50%      { transform: translate(0, -28px); }
        60%      { transform: translate(0, 3px); }
        80%      { transform: translate(0, -18px); }
        90%      { transform: translate(0, 3px); }
      }
      .animate-joy-2 { animation: joy-2-hops 1.2s 1 ease-in-out forwards; }

      /* JOY VARIANT 3 — Pirouette spin */
      @keyframes joy-3-pirouette {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        25%      { transform: translate(0, 10px) scale(1.1, 0.9) rotate(0deg); }
        50%      { transform: translate(0, -45px) scale(0.9, 1.1) rotate(180deg); }
        75%      { transform: translate(0, 5px) scale(1.1, 0.9) rotate(360deg); }
      }
      .animate-joy-3 { animation: joy-3-pirouette 1.2s 1 cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

      /* JOY VARIANT 4 — Ecstatic squash/stretch */
      @keyframes joy-4-squash {
        0%, 100% { transform: scale(1, 1) translateY(0); }
        20%      { transform: scale(1.4, 0.7) translateY(0); }
        50%      { transform: scale(0.7, 1.4) translateY(-12px); }
        80%      { transform: scale(1.3, 0.75) translateY(0); }
      }
      .animate-joy-4 { animation: joy-4-squash 1.2s 1 ease-in-out forwards; transform-origin: center bottom; }

      /* JOY VARIANT 5 — Wave of joy */
      @keyframes joy-5-wave {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        20%      { transform: translate(-4px, -10px) rotate(-7deg); }
        40%      { transform: translate(4px, -18px) rotate(7deg); }
        60%      { transform: translate(-4px, -12px) rotate(-5deg); }
        80%      { transform: translate(4px, -6px) rotate(5deg); }
      }
      .animate-joy-5 { animation: joy-5-wave 1.2s 1 ease-in-out forwards; }

      /* === LAUGH (1.2s : 0.6s × 2) === */
      @keyframes laugh-2 { 0%,100%{transform:translateY(0) scale(1,1) rotate(0);} 25%{transform:translateY(15px) scale(1.35,0.65) rotate(-7deg);} 75%{transform:translateY(-10px) scale(0.85,1.15) rotate(7deg);} }
      .animate-laugh-2 { animation: laugh-2 0.6s 2 ease-in-out forwards; }
      @keyframes laugh-3 { 0%,100%{transform:translate(0,0);} 25%{transform:translate(-8px,5px);} 50%{transform:translate(0,-5px);} 75%{transform:translate(8px,5px);} }
      .animate-laugh-3 { animation: laugh-3 0.6s 2 ease-in-out forwards; }
      @keyframes laugh-4 { 0%,100%{transform:translateY(0);} 25%{transform:translateY(-20px) scale(0.9,1.1);} 50%{transform:translateY(0) scale(1.1,0.9);} 75%{transform:translateY(-20px) scale(0.9,1.1);} }
      .animate-laugh-4 { animation: laugh-4 0.6s 2 ease-in-out forwards; }
      @keyframes laugh-5 { 0%,100%{transform:rotate(0) translateY(0);} 25%{transform:rotate(8deg) translateY(5px);} 50%{transform:rotate(0) translateY(-3px);} 75%{transform:rotate(-8deg) translateY(5px);} }
      .animate-laugh-5 { animation: laugh-5 0.6s 2 ease-in-out forwards; }

      /* === SADNESS (3s) === */
      @keyframes sadness-2 { 0%,100%{transform:translateY(0) scale(1,1);} 50%{transform:translateY(25px) scale(1.2,0.8);} }
      .animate-sadness-2 { animation: sadness-2 3s 1 ease-in-out forwards; }
      @keyframes sadness-3 { 0%,100%{transform:rotate(0) translateY(0);} 50%{transform:rotate(-12deg) translateY(8px);} }
      .animate-sadness-3 { animation: sadness-3 3s 1 ease-in-out forwards; }
      @keyframes sadness-4 { 0%,100%{transform:rotate(0);} 20%,60%{transform:rotate(-5deg);} 40%,80%{transform:rotate(5deg);} }
      .animate-sadness-4 { animation: sadness-4 3s 1 ease-in-out forwards; }
      @keyframes sadness-5 { 0%,100%{transform:translate(0,0);} 25%{transform:translate(-2px,4px);} 50%{transform:translate(0,8px);} 75%{transform:translate(2px,4px);} }
      .animate-sadness-5 { animation: sadness-5 3s 1 ease-in-out forwards; }

      /* === CRY (2s) === */
      @keyframes cry-2 { 0%,100%{transform:translateY(0) scale(1,1);} 20%,60%{transform:translateY(18px) scale(1.25,0.75);} 40%,80%{transform:translateY(6px) scale(0.9,1.1);} }
      .animate-cry-2 { animation: cry-2 2s 1 ease-in-out forwards; }
      @keyframes cry-3 { 0%,100%{transform:translate(0,0) rotate(0);} 20%,60%{transform:translate(-3px,8px) rotate(-3deg);} 40%,80%{transform:translate(3px,8px) rotate(3deg);} }
      .animate-cry-3 { animation: cry-3 2s 1 ease-in-out forwards; }
      @keyframes cry-4 { 0%,100%{transform:translateY(0) scale(1,1);} 50%{transform:translateY(15px) scale(1.1,0.9);} }
      .animate-cry-4 { animation: cry-4 2s 1 ease-in-out forwards; }
      @keyframes cry-5 { 0%,100%{transform:translate(0,0);} 10%,30%,50%,70%,90%{transform:translate(-1px,3px);} 20%,40%,60%,80%{transform:translate(1px,3px);} }
      .animate-cry-5 { animation: cry-5 2s 1 ease-in-out forwards; }

      /* === PAIN (0.8s) === */
      @keyframes pain-2 { 0%{transform:translateY(0);} 20%{transform:translateY(20px) scale(1.4,0.6);} 40%{transform:translateY(-10px) scale(0.8,1.2);} 60%{transform:translateY(15px) scale(1.3,0.7);} 80%{transform:translateY(-5px) scale(0.9,1.1);} 100%{transform:translateY(0);} }
      .animate-pain-2 { animation: pain-2 0.8s 1 cubic-bezier(0.22,1,0.36,1) forwards; }
      @keyframes pain-3 { 0%,100%{transform:scale(1,1);} 30%,70%{transform:scale(1.1,0.9) translateY(10px);} }
      .animate-pain-3 { animation: pain-3 0.8s 1 ease-in-out forwards; }
      @keyframes pain-4 { 0%,100%{transform:translate(0,0) rotate(0);} 20%{transform:translate(-15px,0) rotate(-10deg);} 60%{transform:translate(15px,0) rotate(10deg);} }
      .animate-pain-4 { animation: pain-4 0.8s 1 ease-in-out forwards; }
      @keyframes pain-5 { 0%,100%{transform:translateY(0) scale(1,1);} 50%{transform:translateY(30px) scale(1.3,0.7);} }
      .animate-pain-5 { animation: pain-5 0.8s 1 ease-in-out forwards; }

      /* === TERROR (1s) === */
      @keyframes terror-2 { 0%,100%{transform:translate(0,0) rotate(0);} 10%,30%,50%,70%,90%{transform:translate(-4px,-2px) rotate(-3deg);} 20%,40%,60%,80%{transform:translate(4px,2px) rotate(3deg);} }
      .animate-terror-2 { animation: terror-2 1s 1 linear forwards; }
      @keyframes terror-3 { 0%,100%{transform:scale(1,1);} 50%{transform:scale(0.95,1.02);} }
      .animate-terror-3 { animation: terror-3 1s 1 ease-in-out forwards; }
      @keyframes terror-4 { 0%,100%{transform:scale(1,1) translateY(0);} 50%{transform:scale(0.85,1.05) translateY(-8px);} }
      .animate-terror-4 { animation: terror-4 1s 1 ease-in-out forwards; }
      @keyframes terror-5 { 0%,100%{transform:translate(0,0);} 25%{transform:translate(-3px,-15px);} 50%{transform:translate(3px,-10px);} 75%{transform:translate(-3px,-5px);} }
      .animate-terror-5 { animation: terror-5 1s 1 ease-in-out forwards; }

      /* === PUZZLED (2s) === */
      @keyframes puzzled-2 { 0%,100%{transform:rotate(0);} 25%{transform:rotate(-25deg) translateX(-12px);} 50%{transform:rotate(25deg) translateX(12px);} 75%{transform:rotate(-12deg) translateX(-6px);} }
      .animate-puzzled-2 { animation: puzzled-2 2s 1 ease-in-out forwards; }
      @keyframes puzzled-3 { 0%,100%{transform:rotate(0);} 50%{transform:rotate(-20deg);} }
      .animate-puzzled-3 { animation: puzzled-3 2s 1 ease-in-out forwards; }
      @keyframes puzzled-4 { 0%,100%{transform:translateY(0) rotate(0);} 20%,40%,60%,80%{transform:translateY(-3px) rotate(-3deg);} }
      .animate-puzzled-4 { animation: puzzled-4 2s 1 ease-in-out forwards; }
      @keyframes puzzled-5 { 0%,100%{transform:translateY(0) scale(1,1);} 25%,75%{transform:translateY(-5px) scale(1,0.95);} }
      .animate-puzzled-5 { animation: puzzled-5 2s 1 ease-in-out forwards; }

      /* === IMPATIENT (0.5s, infinite via Boucle) === */
      @keyframes impatient-2 { 0%,100%{transform:translate(0,0) rotate(0) scaleY(1);} 25%{transform:translate(-1px,-3px) rotate(-3deg) scaleY(1.04);} 50%{transform:translate(0,1px) scaleY(0.95);} 75%{transform:translate(1px,-3px) rotate(3deg) scaleY(1.04);} }
      .animate-impatient-2 { animation: impatient-2 0.35s 1 ease-in-out forwards; }
      @keyframes impatient-3 { 0%,100%{transform:rotate(0);} 50%{transform:rotate(-3deg);} }
      .animate-impatient-3 { animation: impatient-3 0.5s 1 ease-in-out forwards; }
      @keyframes impatient-4 { 0%,100%{transform:translate(0,0) rotate(0);} 15%{transform:translate(-4px,-7px) rotate(-6deg);} 50%{transform:translate(0,1px) scaleY(0.92);} 85%{transform:translate(4px,-7px) rotate(6deg);} }
      .animate-impatient-4 { animation: impatient-4 0.5s 1 ease-in-out forwards; }
      @keyframes impatient-5 { 0%,100%{transform:translateY(0) rotate(0);} 25%{transform:translateY(-6px) rotate(-2deg);} 75%{transform:translateY(-6px) rotate(2deg);} }
      .animate-impatient-5 { animation: impatient-5 0.5s 1 ease-in-out forwards; }

      /* === JUMPS (0.8s base) === */
      @keyframes jump-up-2 { 0%{transform:translate(0,0);} 20%{transform:translate(0,5px) scale(1.15,0.85);} 50%{transform:translate(0,-7rem) scale(0.85,1.15);} 85%{transform:translate(0,-3rem) scale(1.15,0.85);} 100%{transform:translate(0,-3.5rem);} }
      .animate-jump-up-2 { animation: jump-up-2 0.8s 1 ease-out forwards; }
      @keyframes jump-up-3 { 0%{transform:translate(0,0);} 50%{transform:translate(0,-3rem);} 100%{transform:translate(0,-2rem);} }
      .animate-jump-up-3 { animation: jump-up-3 0.8s 1 ease-out forwards; }
      @keyframes jump-up-4 { 0%{transform:translate(0,0) rotate(0);} 50%{transform:translate(0,-4.5rem) rotate(180deg);} 100%{transform:translate(0,-3rem) rotate(360deg);} }
      .animate-jump-up-4 { animation: jump-up-4 0.8s 1 ease-out forwards; }
      @keyframes jump-up-5 { 0%{transform:translate(0,0);} 25%{transform:translate(0,-3.5rem);} 40%{transform:translate(0,-1rem);} 55%{transform:translate(0,-3rem);} 70%{transform:translate(0,-1.5rem);} 100%{transform:translate(0,-3rem);} }
      .animate-jump-up-5 { animation: jump-up-5 0.8s 1 ease-out forwards; }

      @keyframes jump-down-2 { 0%{transform:translate(0,0);} 50%{transform:translate(0,4rem) scale(1.1,0.9);} 100%{transform:translate(0,3.5rem);} }
      .animate-jump-down-2 { animation: jump-down-2 0.8s 1 ease-out forwards; }
      @keyframes jump-down-3 { 0%{transform:translate(0,0);} 100%{transform:translate(0,2rem);} }
      .animate-jump-down-3 { animation: jump-down-3 0.8s 1 ease-out forwards; }
      @keyframes jump-down-4 { 0%{transform:translate(0,0) rotate(0);} 50%{transform:translate(0,1.5rem) rotate(180deg);} 100%{transform:translate(0,3rem) rotate(360deg);} }
      .animate-jump-down-4 { animation: jump-down-4 0.8s 1 ease-out forwards; }
      @keyframes jump-down-5 { 0%{transform:translate(0,0);} 35%{transform:translate(0,3rem);} 50%{transform:translate(0,1rem);} 70%{transform:translate(0,3.5rem);} 100%{transform:translate(0,3rem);} }
      .animate-jump-down-5 { animation: jump-down-5 0.8s 1 ease-out forwards; }

      @keyframes jump-left-2 { 0%{transform:translate(0,0);} 50%{transform:translate(-2.5rem,-50px) scale(0.9,1.1);} 100%{transform:translate(-5rem,0);} }
      .animate-jump-left-2 { animation: jump-left-2 0.8s 1 ease-out forwards; }
      @keyframes jump-left-3 { 0%{transform:translate(0,0);} 50%{transform:translate(-1rem,-15px);} 100%{transform:translate(-2rem,0);} }
      .animate-jump-left-3 { animation: jump-left-3 0.8s 1 ease-out forwards; }
      @keyframes jump-left-4 { 0%{transform:translate(0,0) rotate(0);} 50%{transform:translate(-1.5rem,-30px) rotate(-180deg);} 100%{transform:translate(-3rem,0) rotate(-360deg);} }
      .animate-jump-left-4 { animation: jump-left-4 0.8s 1 ease-out forwards; }
      @keyframes jump-left-5 { 0%{transform:translate(0,0);} 30%{transform:translate(-1.5rem,-25px);} 60%{transform:translate(-2.5rem,-15px);} 100%{transform:translate(-3rem,0);} }
      .animate-jump-left-5 { animation: jump-left-5 0.8s 1 ease-out forwards; }

      @keyframes jump-right-2 { 0%{transform:translate(0,0);} 50%{transform:translate(2.5rem,-50px) scale(0.9,1.1);} 100%{transform:translate(5rem,0);} }
      .animate-jump-right-2 { animation: jump-right-2 0.8s 1 ease-out forwards; }
      @keyframes jump-right-3 { 0%{transform:translate(0,0);} 50%{transform:translate(1rem,-15px);} 100%{transform:translate(2rem,0);} }
      .animate-jump-right-3 { animation: jump-right-3 0.8s 1 ease-out forwards; }
      @keyframes jump-right-4 { 0%{transform:translate(0,0) rotate(0);} 50%{transform:translate(1.5rem,-30px) rotate(180deg);} 100%{transform:translate(3rem,0) rotate(360deg);} }
      .animate-jump-right-4 { animation: jump-right-4 0.8s 1 ease-out forwards; }
      @keyframes jump-right-5 { 0%{transform:translate(0,0);} 30%{transform:translate(1.5rem,-25px);} 60%{transform:translate(2.5rem,-15px);} 100%{transform:translate(3rem,0);} }
      .animate-jump-right-5 { animation: jump-right-5 0.8s 1 ease-out forwards; }

      /* === SLIDES (0.6s base) === */
      @keyframes slide-up-2 { 0%{transform:translate(0,0);} 100%{transform:translate(0,-6rem);} }
      .animate-slide-up-2 { animation: slide-up-2 0.6s 1 ease-in-out forwards; }
      @keyframes slide-up-3 { 0%{transform:translate(0,0);} 100%{transform:translate(0,-2rem);} }
      .animate-slide-up-3 { animation: slide-up-3 0.6s 1 cubic-bezier(0.45,0.05,0.55,0.95) forwards; }
      @keyframes slide-up-4 { 0%{transform:translate(0,0) rotate(0);} 50%{transform:translate(-1rem,-2rem) rotate(-15deg);} 100%{transform:translate(0,-4rem) rotate(0);} }
      .animate-slide-up-4 { animation: slide-up-4 0.6s 1 ease-in-out forwards; }
      @keyframes slide-up-5 { 0%{transform:translate(0,0);} 50%{transform:translate(0,-2rem) scale(0.9,1.1);} 100%{transform:translate(0,-4rem);} }
      .animate-slide-up-5 { animation: slide-up-5 0.6s 1 ease-out forwards; }

      @keyframes slide-down-2 { 0%{transform:translate(0,0);} 100%{transform:translate(0,6rem);} }
      .animate-slide-down-2 { animation: slide-down-2 0.6s 1 ease-in-out forwards; }
      @keyframes slide-down-3 { 0%{transform:translate(0,0);} 100%{transform:translate(0,2rem);} }
      .animate-slide-down-3 { animation: slide-down-3 0.6s 1 cubic-bezier(0.45,0.05,0.55,0.95) forwards; }
      @keyframes slide-down-4 { 0%{transform:translate(0,0) rotate(0);} 50%{transform:translate(1rem,2rem) rotate(15deg);} 100%{transform:translate(0,4rem) rotate(0);} }
      .animate-slide-down-4 { animation: slide-down-4 0.6s 1 ease-in-out forwards; }
      @keyframes slide-down-5 { 0%{transform:translate(0,0);} 50%{transform:translate(0,2rem) scale(1.1,0.9);} 100%{transform:translate(0,4rem);} }
      .animate-slide-down-5 { animation: slide-down-5 0.6s 1 ease-out forwards; }

      @keyframes slide-left-2 { 0%{transform:translate(0,0) skewX(0);} 50%{transform:translate(-3rem,0) skewX(15deg);} 100%{transform:translate(-6rem,0) skewX(0);} }
      .animate-slide-left-2 { animation: slide-left-2 0.6s 1 ease-in-out forwards; }
      @keyframes slide-left-3 { 0%{transform:translate(0,0);} 100%{transform:translate(-2rem,0);} }
      .animate-slide-left-3 { animation: slide-left-3 0.6s 1 cubic-bezier(0.45,0.05,0.55,0.95) forwards; }
      @keyframes slide-left-4 { 0%{transform:translate(0,0);} 25%{transform:translate(-1rem,-0.5rem);} 50%{transform:translate(-2rem,0.5rem);} 75%{transform:translate(-3rem,-0.5rem);} 100%{transform:translate(-4rem,0);} }
      .animate-slide-left-4 { animation: slide-left-4 0.6s 1 ease-in-out forwards; }
      @keyframes slide-left-5 { 0%{transform:translate(0,0);} 80%{transform:translate(-4.2rem,0);} 90%{transform:translate(-3.8rem,0);} 100%{transform:translate(-4rem,0);} }
      .animate-slide-left-5 { animation: slide-left-5 0.6s 1 ease-out forwards; }

      @keyframes slide-right-2 { 0%{transform:translate(0,0) skewX(0);} 50%{transform:translate(3rem,0) skewX(-15deg);} 100%{transform:translate(6rem,0) skewX(0);} }
      .animate-slide-right-2 { animation: slide-right-2 0.6s 1 ease-in-out forwards; }
      @keyframes slide-right-3 { 0%{transform:translate(0,0);} 100%{transform:translate(2rem,0);} }
      .animate-slide-right-3 { animation: slide-right-3 0.6s 1 cubic-bezier(0.45,0.05,0.55,0.95) forwards; }
      @keyframes slide-right-4 { 0%{transform:translate(0,0);} 25%{transform:translate(1rem,-0.5rem);} 50%{transform:translate(2rem,0.5rem);} 75%{transform:translate(3rem,-0.5rem);} 100%{transform:translate(4rem,0);} }
      .animate-slide-right-4 { animation: slide-right-4 0.6s 1 ease-in-out forwards; }
      @keyframes slide-right-5 { 0%{transform:translate(0,0);} 80%{transform:translate(4.2rem,0);} 90%{transform:translate(3.8rem,0);} 100%{transform:translate(4rem,0);} }
      .animate-slide-right-5 { animation: slide-right-5 0.6s 1 ease-out forwards; }

      /* === DICE LANCER variants (0.5s, live display only — export still uses #1) === */
      @keyframes dice-roll-2 { 0%{transform:translate(0,0) rotate(0) scale(1);} 50%{transform:translate(5px,-50px) rotate(-360deg) scale(1.1);} 100%{transform:translate(0,0) rotate(-360deg) scale(1);} }
      .animate-dice-roll-2 { animation: dice-roll-2 0.5s 1 cubic-bezier(0.22,1,0.36,1) forwards; transform-origin: center center; }
      @keyframes dice-roll-3 { 0%{transform:rotate(0);} 100%{transform:rotate(-1080deg);} }
      .animate-dice-roll-3 { animation: dice-roll-3 0.5s 1 cubic-bezier(0.22,1,0.36,1) forwards; transform-origin: center center; }
      @keyframes dice-roll-4 { 0%,100%{transform:scale(1);} 50%{transform:scale(1.4) rotate(-720deg);} }
      .animate-dice-roll-4 { animation: dice-roll-4 0.5s 1 ease-in-out forwards; transform-origin: center center; }
      @keyframes dice-roll-5 { 0%{transform:translate(0,0) rotate(0);} 25%{transform:translate(-10px,-30px) rotate(-180deg);} 50%{transform:translate(10px,-50px) rotate(-360deg);} 75%{transform:translate(-5px,-20px) rotate(-540deg);} 100%{transform:translate(0,0) rotate(-720deg);} }
      .animate-dice-roll-5 { animation: dice-roll-5 0.5s 1 ease-out forwards; transform-origin: center center; }

      /* === DICE VIBRER variants (0.18s base) === */
      @keyframes dice-vibrate-2 { 0%,100%{transform:translate(0,0);} 25%{transform:translate(-3px,2px);} 75%{transform:translate(3px,-2px);} }
      .animate-dice-vibrate-2 { animation: dice-vibrate-2 0.1s infinite linear; transform-origin: center center; }
      @keyframes dice-vibrate-3 { 0%,100%{transform:translate(0,0);} 25%{transform:translate(-4px,3px);} 50%{transform:translate(4px,-3px);} 75%{transform:translate(-3px,-3px);} }
      .animate-dice-vibrate-3 { animation: dice-vibrate-3 0.18s infinite linear; transform-origin: center center; }
      @keyframes dice-vibrate-4 { 0%,100%{transform:rotate(0);} 25%{transform:rotate(-4deg);} 75%{transform:rotate(4deg);} }
      .animate-dice-vibrate-4 { animation: dice-vibrate-4 0.18s infinite linear; transform-origin: center center; }
      @keyframes dice-vibrate-5 { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
      .animate-dice-vibrate-5 { animation: dice-vibrate-5 0.18s infinite linear; transform-origin: center center; }

      /* PUZZLED: Pronounced side-to-side balancing */
      @keyframes puzzled-balance {
        0% { transform: rotate(0deg) translateX(0); }
        25% { transform: rotate(-15deg) translateX(-8px); }
        50% { transform: rotate(15deg) translateX(8px); }
        75% { transform: rotate(-8deg) translateX(-4px); }
        100% { transform: rotate(0deg) translateX(0); }
      }

      /* JUMP RIGHT (Ampleur divisée par 2) */
      @keyframes jump-right-arc {
        0% { transform: translate(0, 0) scale(1, 1); }
        20% { transform: translate(0, 5px) scale(1.1, 0.9); }
        50% { transform: translate(1.5rem, -30px) scale(0.9, 1.1); }
        85% { transform: translate(3rem, 5px) scale(1.1, 0.9); }
        100% { transform: translate(3rem, 0) scale(1, 1); }
      }

      /* JUMP LEFT (Ampleur divisée par 2) */
      @keyframes jump-left-arc {
        0% { transform: translate(0, 0) scale(1, 1); }
        20% { transform: translate(0, 5px) scale(1.1, 0.9); }
        50% { transform: translate(-1.5rem, -30px) scale(0.9, 1.1); }
        85% { transform: translate(-3rem, 5px) scale(1.1, 0.9); }
        100% { transform: translate(-3rem, 0) scale(1, 1); }
      }

      /* JUMP UP (Ampleur divisée par 2) */
      @keyframes jump-up-arc {
        0% { transform: translate(0, 0) scale(1, 1); }
        20% { transform: translate(0, 5px) scale(1.1, 0.9); }
        50% { transform: translate(0, -4.5rem) scale(0.9, 1.1); }
        85% { transform: translate(0, -2.75rem) scale(1.1, 0.9); }
        100% { transform: translate(0, -3rem) scale(1, 1); }
      }

      /* JUMP DOWN (Ampleur divisée par 2) */
      @keyframes jump-down-arc {
        0% { transform: translate(0, 0) scale(1, 1); }
        20% { transform: translate(0, -5px) scale(0.9, 1.1); }
        50% { transform: translate(0, 1.5rem) scale(1.05, 0.95); }
        85% { transform: translate(0, 3.25rem) scale(1.15, 0.85); }
        100% { transform: translate(0, 3rem) scale(1, 1); }
      }

      /* SLIDE ANIMATIONS */
      @keyframes slide-right {
        0% { transform: translate(0, 0) skewX(0deg); }
        20% { transform: translate(0.5rem, 0) skewX(-10deg) scale(1.05, 0.95); }
        80% { transform: translate(3.5rem, 0) skewX(5deg) scale(1, 1); }
        100% { transform: translate(4rem, 0) skewX(0deg); }
      }

      @keyframes slide-left {
        0% { transform: translate(0, 0) skewX(0deg); }
        20% { transform: translate(-0.5rem, 0) skewX(10deg) scale(1.05, 0.95); }
        80% { transform: translate(-3.5rem, 0) skewX(-5deg) scale(1, 1); }
        100% { transform: translate(-4rem, 0) skewX(0deg); }
      }

      @keyframes slide-up {
        0% { transform: translate(0, 0) scale(1, 1); }
        20% { transform: translate(0, -0.5rem) scale(0.95, 1.05); }
        80% { transform: translate(0, -3.5rem) scale(1, 1); }
        100% { transform: translate(0, -4rem) scale(1, 1); }
      }

      @keyframes slide-down {
        0% { transform: translate(0, 0) scale(1, 1); }
        20% { transform: translate(0, 0.5rem) scale(1.05, 0.95); }
        80% { transform: translate(0, 3.5rem) scale(1, 1); }
        100% { transform: translate(0, 4rem) scale(1, 1); }
      }

      /* BLINK ANIMATION */
      @keyframes blink-eye {
        0%, 45%, 55%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(0.1); }
      }

      /* IDLE VARIANT 2 — Calm breathing */
      @keyframes idle-breathe {
        0%, 100% { transform: scale(1, 1); }
        50%      { transform: scale(1.03, 0.98); }
      }
      .animate-idle-2 { animation: idle-breathe 4s 1 ease-in-out forwards; transform-origin: center bottom; }

      /* IDLE VARIANT 3 — Balancing sway */
      @keyframes idle-sway {
        0%, 100% { transform: rotate(0deg); }
        25%      { transform: rotate(-2.5deg); }
        75%      { transform: rotate(2.5deg); }
      }
      .animate-idle-3 { animation: idle-sway 4s 1 ease-in-out forwards; transform-origin: center bottom; }

      /* IDLE VARIANT 4 — Curious glance (pupils dart around + blink) */
      @keyframes idle-glance {
        0%, 30%, 80%, 100% { transform: scaleY(1) translateX(0); }
        37%, 45%           { transform: scaleY(1) translateX(2px); }
        50%                { transform: scaleY(0.1) translateX(2px); }
        55%                { transform: scaleY(1) translateX(2px); }
        62%, 72%           { transform: scaleY(1) translateX(-2px); }
      }
      .animate-idle-4-eye { animation: idle-glance 4s 1 ease-in-out forwards; transform-origin: center; transform-box: fill-box; }

      /* IDLE VARIANT 5 — Foot tap / patient waiting bobs */
      @keyframes idle-tap {
        0%, 25%, 50%, 75%, 100% { transform: translateY(0); }
        12.5%, 37.5%, 62.5%, 87.5% { transform: translateY(-1.5px); }
      }
      .animate-idle-5 { animation: idle-tap 4s 1 ease-in-out forwards; }

      /* BATMAN: Moody brooding */
      @keyframes batman-brood {
         0%, 100% { transform: scale(1); filter: brightness(1); }
         50% { transform: scale(1.02); filter: brightness(0.85); }
      }

      /* SPHERE PULSE: Dilate and contract by 20% */
      @keyframes sphere-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.2); }
      }

      /* IMPATIENT: pawn stomps in place, leans side to side (clean loop) */
      @keyframes impatient-stomp {
        0%, 100% { transform: translate(0, 0)     rotate(0deg)  scaleY(1); }
        15%      { transform: translate(-2px, -5px) rotate(-4deg) scaleY(1.06); }
        30%      { transform: translate(-2px, 1px)  rotate(-2deg) scaleY(0.95); }
        50%      { transform: translate(0, 1px)     rotate(0deg)  scaleY(0.95); }
        70%      { transform: translate(2px, 1px)   rotate(2deg)  scaleY(0.95); }
        85%      { transform: translate(2px, -5px)  rotate(4deg)  scaleY(1.06); }
      }
      .animate-impatient { animation: impatient-stomp 0.5s 1 ease-in-out forwards; }

      /* MOI bubble: pop on/off every 300ms */
      @keyframes moi-pop {
        0%, 5%      { transform: scale(0)   translateY(2px); opacity: 0; }
        10%         { transform: scale(1.15) translateY(-1px); opacity: 1; }
        20%         { transform: scale(1)   translateY(0);    opacity: 1; }
        45%         { transform: scale(1)   translateY(0);    opacity: 1; }
        50%, 100%   { transform: scale(0)   translateY(2px);  opacity: 0; }
      }
      .animate-moi-bubble {
        animation: moi-pop 0.6s 1 cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        transform-box: fill-box;
        transform-origin: center bottom;
      }

      /* SELECTOR halo ring: rotating dashes */
      @keyframes halo-ring-spin {
        to { stroke-dashoffset: -160; }
      }
      .animate-halo-ring { animation: halo-ring-spin 4.3s linear infinite; }

      /* DICE VIBRATE: rapid jitter to indicate "your turn" */
      @keyframes dice-vibrate {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        10%      { transform: translate(-1.95px, 0.65px) rotate(-1.95deg); }
        20%      { transform: translate(1.95px, -0.65px) rotate(1.95deg); }
        30%      { transform: translate(-1.95px, -0.65px) rotate(-1.3deg); }
        40%      { transform: translate(1.95px, 0.65px) rotate(1.3deg); }
        50%      { transform: translate(-1.3px, 1.3px) rotate(-1.95deg); }
        60%      { transform: translate(1.3px, -1.3px) rotate(1.95deg); }
        70%      { transform: translate(-1.95px, 0px) rotate(-1.3deg); }
        80%      { transform: translate(1.95px, 0.65px) rotate(1.3deg); }
        90%      { transform: translate(-0.65px, -1.3px) rotate(-1.3deg); }
      }
      .animate-dice-vibrate {
        animation: dice-vibrate 0.18s infinite linear;
        transform-origin: center center;
      }

      /* DICE ROLL: tumble + bounce + motion blur, 0.5s */
      @keyframes dice-roll {
        0%   { transform: translate(0, 0)         rotate(0deg)    scale(1);    filter: none; }
        20%  { transform: translate(-14px, -38px) rotate(-220deg) scale(1.08); filter: blur(0.7px); }
        45%  { transform: translate(10px, -62px)  rotate(-420deg) scale(1.15); filter: blur(0.7px); }
        70%  { transform: translate(-6px, -22px)  rotate(-600deg) scale(1.05); filter: blur(0.3px); }
        90%  { transform: translate(2px, -4px)    rotate(-700deg) scale(0.97); filter: none; }
        100% { transform: translate(0, 0)         rotate(-720deg) scale(1);    filter: none; }
      }
      .animate-dice-roll {
        animation: dice-roll 0.5s 1 cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transform-origin: center center;
      }

      /* SLEEPER ZZZZ: snake undulation + 3D zoom toward viewer */
      @keyframes zzz-snake-3d {
        0%   { transform: translate(0px,  4px)  scale(0.4); opacity: 0; }
        15%  { transform: translate(3px,  0px)  scale(0.7); opacity: 0.9; }
        35%  { transform: translate(-3px, -6px) scale(1.0); opacity: 1; }
        55%  { transform: translate(3px,  -12px) scale(1.4); opacity: 1; }
        75%  { transform: translate(-3px, -18px) scale(1.8); opacity: 0.8; }
        100% { transform: translate(0px,  -26px) scale(2.4); opacity: 0; }
      }

      .animate-breathe { animation: breathe 3s infinite ease-in-out; }
      .animate-terror { animation: terror-shiver 1s 1 linear forwards; }
      .animate-laugh { animation: laugh-belly 0.6s 2 ease-in-out forwards; }
      .animate-sadness { animation: sadness-slump 3s 1 ease-in-out forwards; }
      .animate-cry { animation: cry-sobbing 2s 1 ease-in-out forwards; }
      .animate-pain { animation: pain-impact 0.8s 1 cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      .animate-joy { animation: joy-celebrate 1.2s 1 cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
      .animate-puzzled { animation: puzzled-balance 2s 1 ease-in-out forwards; }
      .animate-jump-right { animation: jump-right-arc 0.8s 1 ease-out forwards; }
      .animate-jump-left { animation: jump-left-arc 0.8s 1 ease-out forwards; }
      .animate-jump-up { animation: jump-up-arc 0.8s 1 ease-out forwards; }
      .animate-jump-down { animation: jump-down-arc 0.8s 1 ease-out forwards; }
      
      .animate-slide-right { animation: slide-right 0.6s 1 cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards; }
      .animate-slide-left { animation: slide-left 0.6s 1 cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards; }
      .animate-slide-up { animation: slide-up 0.6s 1 cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards; }
      .animate-slide-down { animation: slide-down 0.6s 1 cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards; }

      .animate-batman { animation: batman-brood 4s 1 ease-in-out forwards; }
      .animate-blink { animation: blink-eye 4s infinite; transform-origin: center; }
      .animate-zzz-letter {
        animation: zzz-snake-3d 2s infinite ease-in-out;
        transform-origin: center;
        transform-box: fill-box;
      }
      
      .animate-sphere-pulse { 
        animation: sphere-pulse 3s infinite ease-in-out; 
        transform-origin: 50px 75px; /* Center of the sphere adjusted */
      }

    </style>
